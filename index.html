<style>

:root {
  --bg-dark: #0a0e17;
  --bg-panel: #111927;
  --bg-card: #1a2332;
  --accent-cyan: #00e5ff;
  --accent-magenta: #ff006e;
  --accent-gold: #ffd60a;
  --accent-green: #00ff87;
  --text-primary: #e8edf5;
  --text-dim: #7a8ba7;

* { margin: 0; padding: 0; box-sizing: border-box; }

body {

  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.scanlines {

  top: 0; left: 0; right: 0; bottom: 0;

  pointer-events: none;
  z-index: 999;
}

.game-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  text-align: center;
  padding: 20px 0 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.header h1 {

  font-size: 14px;
  color: var(--accent-cyan);

  margin-bottom: 8px;
}

.header .subtitle {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 16px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  flex-wrap: wrap;

}

.status-item { display: flex; align-items: center; gap: 6px; }
.status-label { color: var(--text-dim); }

.panel {

}

.panel-title {

}

.narrative {

}

.narrative .highlight { color: var(--accent-cyan); font-weight: 600; }
.narrative .suspect-clue { color: var(--accent-magenta); font-weight: 600; }
.narrative .location-name { color: var(--accent-gold); font-weight: 700; }

.witness-box {

.witness-name {

.witness-text {

  line-height: 1.6;
  color: var(--text-primary);
  font-style: italic;
}

.clue-tracker {

.clue-item {

.warrant-field {

  border: 1px solid var(--border);

.warrant-field label {

.warrant-field select:focus { outline: none; border-color: var(--accent-cyan); }

.action-btn {

// Place your audio file next to this HTML file.

// Rename it to "noir-theme.mp3" (or update the filename below)
const NoirMusic = (() => {
  const FILENAMES = ['noir-theme.mp3', 'noir-theme.ogg', 'noir-theme.wav'];
  let audio = null;
  let playing = false;
  let loaded = false;
  let triedLoad = false;

  function init() {
    if (triedLoad) return;
    triedLoad = true;
    audio = new Audio();
    audio.loop = true;
    audio.volume = 0.35;

    // Try each filename in order
    let idx = 0;
    function tryNext() {
      if (idx >= FILENAMES.length) {
        loaded = false;
        console.warn('No music file found. Place noir-theme.mp3 next to this HTML file.');
        return;
      }
      audio.src = FILENAMES[idx];
      audio.load();
    }

    audio.addEventListener('canplaythrough', () => { loaded = true; }, { once: false });
    audio.addEventListener('error', () => { idx++; tryNext(); });

    tryNext();
  }

  function start() {
    if (!audio) init();
    if (playing) return;
    if (audio) {
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
      playing = true;
    }
  }

  function stop() {
    if (audio) { audio.pause(); }
    playing = false;
  }

  function toggle() {
    if (!audio) init();
    if (playing) stop(); else start();
    return playing;
  }

  function setVolume(v) { if (audio) audio.volume = Math.max(0, Math.min(1, v)); }

  return { toggle, isPlaying: () => playing, setVolume, init };
})();

// Music button
const musicBtn = document.getElementById('musicToggle');
musicBtn.addEventListener('click', () => {
  const on = NoirMusic.toggle();
  musicBtn.innerHTML = on ? '&#9835; MUSIC: ON' : '&#9835; MUSIC: OFF';
  musicBtn.style.borderColor = on ? 'var(--accent-gold)' : 'var(--border)';
});

// ==================== RENDER ====================
const $ = id => document.getElementById(id);
const container = $('gameContainer');

function render() {
  switch(state.phase) {

    case "travel": renderTravel(); break;
    case "witness": renderWitness(); break;
    case "choose": renderChoose(); break;
    case "warrant": renderWarrant(); break;
    case "result": renderResult(); break;

}

function talkToWitness(index) {
  state.witnessIndex = index;
  state.phase = "witness";
  const key = state.stopIndex + '-' + index;
  if (!state.visitedWitnesses.includes(key)) {
    state.visitedWitnesses.push(key);
    const stop = GAME.stops[state.stopIndex];
    const w = stop.witnesses[index];
    state.clues[w.clueType].push({ location: stop.name, clue: w.clue });
  }
  render();
}

  const stop = GAME.stops[state.stopIndex];

      </div>
    </div>
  `;
}

function chooseDestination(id) {
  const stop = GAME.stops[state.stopIndex];
  if (id === stop.nextCorrect) {
    state.feedback = null;
    state.timeLeft -= 1;
    const nextIndex = GAME.stops.findIndex(s => s.id === id);
    state.stopIndex = nextIndex;
    state.trail.push(GAME.stops[nextIndex].name);
    state.phase = "travel";
  } else {
    state.timeLeft -= 2;
    state.feedback = "That's not where the clues point. Review your geography clues and try again. (-2 time units)";
    if (state.timeLeft <= 0) {
      state.phase = "result";
      state.warrantCorrect = false;
    } else {
      state.phase = "choose";
    }
  }
  render();
}

function issueWarrant() {
  const fields = ['w-hair','w-hobby','w-food','w-accessory','w-name'];
  const vals = {};
  for (const f of fields) {
    vals[f] = document.getElementById(f).value;
    if (!vals[f]) { alert("Complete all fields before issuing the warrant!"); return; }
  }
  const c = GAME.culprit;
  state.warrantCorrect = (
    vals['w-hair'] === c.hair &&
    vals['w-hobby'] === c.hobby &&
    vals['w-food'] === c.food &&
    vals['w-accessory'] === c.accessory &&
    vals['w-name'] === c.name
  );
  state.phase = "result";
  render();
}

    <div class="dossier-section">
      <h3>Culture & History</h3>
      ${state.clues.culture.length === 0 ? '<div class="dossier-entry" style="color:var(--text-muted);">No culture clues yet.</div>' :
        state.clues.culture.map(c => `<div class="dossier-entry"><div class="d-label">${c.location}</div><div style="color:var(--accent-gold);">${c.clue}</div></div>`).join('')}
    </div>
    <div class="dossier-section">
      <h3>Travel Log</h3>
      <div class="dossier-entry" style="color:var(--accent-cyan);">${state.trail.join(' \u2192 ')}</div>
    </div>
  `;
}

$('dossierToggle').addEventListener('click', () => { $('dossierPanel').classList.toggle('open'); });
$('dossierClose').addEventListener('click', () => { $('dossierPanel').classList.remove('open'); });

render();
</script>
</body>
</html>
